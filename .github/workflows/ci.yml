name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node.js ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate sources and documentation
        run: npm run validate
      - name: Run regression tests
        run: npm test
      - name: Build addon
        run: npm run build
      - name: Upload checked distribution
        if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Canopy-validated-addon
          path: |
            dist/*.mcaddon
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
